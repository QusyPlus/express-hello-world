name: CI Pipeline

on:
  push:
    branches: [ feature/devops ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Test
        run: yarn test || echo "No test script found, skipping..."

      - name: Build Docker Image
        run: docker build -t my-app-name:latest .

      - name: Notify Success
        if: success()
        run: echo "Pipeline running successfully!"
      
      - name: Notify Failure
        if: failure()
        run: echo "Pipeline failed, please check the logs!"